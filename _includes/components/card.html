<article class="m-10 p-8 border rounded shadow-md relative bg-white">
  <h1 class="text-xl font-bold mb-2">{{ include.title }}</h1>
  <p class="text-gray-600 mb-2 ml-3">{{ include.description }}</p>
  <a href="{{ include.url }}" class="text-blue-500 absolute bottom-2 hover:underline">{{ include.continue-text }}</a>
</article>
