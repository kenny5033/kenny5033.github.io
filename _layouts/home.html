<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../assets/css/falling.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>{{ post.title }}</title>
</head>
<body class="bg-gray-100 text-gray-800">
  {% include components/header.html %}

  <main class="main-blurb p-6 text-center">
    <h1 class="text-3xl font-bold text-right max-w-3xl mx-auto">{{ page.title }}</h1>
    <div class="mt-4 text-left max-w-4xl mx-auto">{{ content }}</div>
    <p class="mt-4">Also check me out at these sites:</p>
    <div class="plugs-box flex justify-center space-x-4 mt-4">
        <a href="https://github.com/kenny5033" target="_blank">
          <img src="/assets/images/github-logo.png" class="w-12">
        </a>
        <a href="https://www.linkedin.com/in/kenneth-howes-b44aba298" target="_blank">
          <img src="/assets/images/linkedin-logo.png" class="w-12">
        </a>
    </div>
    <h2 class="text-2xl font-bold mt-8">Recent Stuff</h2>
  </main>

  <div class="grid grid-cols-2 gap-4">
    {% for post in site.posts %}
    {% include components/card.html 
      title=post.title
      description=post.description
      url=post.project-url
      continue-text="Read more"
    %}
    {% endfor %}
  </div>
</body>
</html>
